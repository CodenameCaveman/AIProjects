name: Deploy Pocket (phone UI) to GitHub Pages

on:
  push:
    branches: [claude/phone-ui]
    paths:
      - "phone-ui/**"
      - ".github/workflows/deploy-phone-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload phone-ui as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: phone-ui

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
