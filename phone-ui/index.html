<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Pocket — Home Screen</title>
<meta name="theme-color" content="#0f0d17" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pocket" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="device" id="device">

  <!-- Status bar (shown on lock + home + inside apps) -->
  <div class="status-bar" id="statusBar">
    <span class="status-time" id="statusTime">--:--</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M2 22h2v-4H2zm4.5 0h2V14h-2zM11 22h2V9h-2zm4.5 0h2V4h-2zM20 22h2v-2h-2z"/></svg>
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.24 4.24 0 0 0-6 0zm-4-4l2 2a7.07 7.07 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <span class="battery" id="batteryWrap">
        <svg viewBox="0 0 26 14" width="24" height="13" aria-hidden="true">
          <rect x="1" y="1" width="21" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <rect x="23" y="4.5" width="2" height="5" rx="1" fill="currentColor"/>
          <rect x="2.5" y="2.5" width="17" height="9" rx="1.2" fill="currentColor" id="batteryFill"/>
        </svg>
      </span>
    </div>
  </div>

  <!-- Lock screen -->
  <section class="screen lock-screen" id="lockScreen" aria-label="Lock screen">
    <div class="lock-content">
      <svg class="lock-icon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/></svg>
      <div class="lock-time" id="lockTime">--:--</div>
      <div class="lock-date" id="lockDate">—</div>
    </div>
    <button class="unlock-hint" id="unlockBtn" aria-label="Unlock">
      <span class="chevron" aria-hidden="true">⌃</span>
      <span>Swipe up or tap to unlock</span>
    </button>
  </section>

  <!-- Home screen -->
  <section class="screen home-screen" id="homeScreen" aria-label="Home screen" hidden>
    <div class="widget" id="homeWidget">
      <div class="widget-time" id="homeTime">--:--</div>
      <div class="widget-date" id="homeDate">—</div>
    </div>

    <div class="app-grid" id="appGrid"><!-- app icons injected --></div>

    <div class="dock" id="dock"><!-- dock icons injected --></div>
  </section>

  <!-- App container -->
  <section class="screen app-screen" id="appScreen" aria-label="Application" hidden>
    <header class="app-topbar">
      <button class="app-back" id="appBack" aria-label="Back to home screen">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
        <span>Home</span>
      </button>
      <h1 class="app-title" id="appTitle">App</h1>
      <div class="app-actions" id="appActions"></div>
    </header>
    <div class="app-body" id="appBody"><!-- active app view injected --></div>
  </section>

  <div class="home-indicator" id="homeIndicator" aria-hidden="true"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
